<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">YatraLens banner</title>
  <desc id="desc">A winding route connects seeing, speaking and arriving against a Kerala-inspired landscape.</desc>
  <defs>
