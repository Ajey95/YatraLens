    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d8e87"/><stop offset="1" stop-color="#123d44"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#sky)"/>
  <circle cx="1008" cy="74" r="98" fill="#65c2a5" opacity=".09"/>
  <circle cx="1104" cy="260" r="166" fill="#85dfbb" opacity=".06"/>
  <path d="M0 278 Q125 224 256 258 T517 264 T783 245 T1200 269 V360 H0Z" fill="#1f655c" opacity=".75"/>
  <path d="M0 303 Q194 270 348 303 T685 299 T1200 300 V360 H0Z" fill="url(#water)" opacity=".95"/>
